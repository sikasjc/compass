name: quality

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - name: Validate macOS/Linux launcher
        if: runner.os != 'Windows'
        run: sh -n scripts/start.sh
      - run: uv run ruff check src tests
      - run: uv run mypy src/compass
      - run: uv run pytest -q
