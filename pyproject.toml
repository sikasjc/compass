[project]
name = "compass"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "akshare>=1.16",
  "baostock>=0.8.9",
  "httpx>=0.28",
  "nicegui>=3,<4",
  "numpy>=2,<3",
  "pandas>=2.2,<4",
  "pyarrow>=18",
  "pydantic>=2.10,<3",
  "requests>=2.32,<3",
  "sqlalchemy>=2,<3",
]

[project.optional-dependencies]
dev = ["hypothesis>=6", "mypy>=1.13", "pytest>=8", "pytest-cov>=6", "ruff>=0.9"]
kronos = [
  "kronos-model-arch==0.1.0",
]
kronos-cuda = [
  "kronos-model-arch==0.1.0",
  "torch>=2.13,<2.14; sys_platform != 'darwin'",
]

[tool.uv]
conflicts = [
  [
    { extra = "kronos" },
    { extra = "kronos-cuda" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu132", extra = "kronos-cuda", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["compass"]
